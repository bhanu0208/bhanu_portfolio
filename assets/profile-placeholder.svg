<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" fill="none" role="img" aria-label="V. Bhanu profile portrait placeholder">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="420" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121827" />
      <stop offset="55%" stop-color="#0c101b" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>
    <radialGradient id="ambient-indigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(110 95) rotate(45) scale(230)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 340) rotate(-35) scale(220)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-stroke" x1="80" y1="60" x2="340" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="silhouette-fill" x1="210" y1="120" x2="210" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid-pattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Surface -->
  <rect width="420" height="460" rx="24" fill="url(#bg-grad)" />
  <rect width="420" height="460" rx="24" fill="url(#grid-pattern)" />
  <rect width="420" height="460" rx="24" fill="url(#ambient-indigo)" />
  <rect width="420" height="460" rx="24" fill="url(#ambient-cyan)" />

  <!-- Decorative Technical Rings -->
  <circle cx="210" cy="215" r="146" stroke="url(#accent-stroke)" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="6 8" />
  <circle cx="210" cy="215" r="118" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="1" />

  <!-- Subtle Code Marks -->
  <text x="34" y="54" fill="#64748b" font-family="monospace" font-size="13" opacity="0.65">&lt;dev /&gt;</text>
  <text x="386" y="54" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="13" opacity="0.75">B.Tech · 1st Yr</text>

  <!-- Minimalist Developer Silhouette -->
  <path d="M98 424C104 342 148 302 210 302C272 302 316 342 322 424" fill="url(#silhouette-fill)" stroke="url(#accent-stroke)" stroke-opacity="0.55" stroke-width="2" />
  <circle cx="210" cy="202" r="56" fill="url(#silhouette-fill)" stroke="url(#accent-stroke)" stroke-opacity="0.7" stroke-width="2.2" />

  <!-- Inner Monogram -->
  <text x="210" y="214" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="32" letter-spacing="2">VB</text>

  <!-- Subtle Placeholder Caption Pill -->
  <rect x="115" y="384" width="190" height="34" rx="17" fill="#0b1120" fill-opacity="0.88" stroke="url(#accent-stroke)" stroke-opacity="0.4" stroke-width="1" />
  <text x="210" y="405" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11.5" letter-spacing="0.6">PROFILE IMAGE PLACEHOLDER</text>
</svg>

